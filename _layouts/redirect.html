<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Overrides the layout jekyll-redirect-from ships by default.

  The stock layout performs the redirect from an inline script element that
  assigns to location. This site's CSP is script-src 'self' with no
  'unsafe-inline', so that script is blocked: it never runs, it logs a CSP
  violation on every hit, and it shows up in header scanners as a real
  violation on an otherwise clean site.

  The meta refresh does the same job with no script at all. Search engines
  treat an instant meta refresh as equivalent to a 301 and follow the
  canonical, so nothing is lost. A visible link is kept as the last resort for
  anyone whose browser ignores both.

  For a true server-side 301, add a Cloudflare Redirect Rule for the old path;
  this page is the in-repo fallback that works without one.
-->
<meta http-equiv="refresh" content="0; url={{ page.redirect.to }}">
<link rel="canonical" href="{{ page.redirect.to }}">
<meta name="robots" content="noindex, follow">
<title>Redirecting to {{ page.redirect.to }}</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<h1>This page has moved</h1>
<p>It now lives at <a href="{{ page.redirect.to }}">{{ page.redirect.to }}</a>. You should be sent there automatically.</p>
</body>
</html>
